<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Avalanche Wallet Connect</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>❄️ Avalanche dApp</h1>
      <p class="subtitle">Connect Wallet (Core Wallet)</p>
        <div class="button-wrapper">
            <button id="connectBtn">Connect Wallet</button>
            <button id="disconnectBtn" disabled>Disconnect Wallet</button>
        </div>
      <div class="card">
        <p><strong>Status:</strong> <span id="status">Not Connected</span></p>
        <p><strong>Message:</strong> <span id="message">-</span></p>
        <p><strong>Wallet Address:</strong> <span id="address">-</span></p>
        <p><strong>Nama(NIM):</strong> <span id="identity">-</span></p>
        <p><strong>Network:</strong> <span id="network">-</span></p>
        <p><strong>Balance:</strong> <span id="balance">-</span></p>
      </div>
    </div>

    <script type="module" src="script.js"></script>
  </body>
</html>
